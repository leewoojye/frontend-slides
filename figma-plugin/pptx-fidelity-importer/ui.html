<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; font: 12px/1.45 Inter, system-ui, sans-serif; color: var(--figma-color-text); background: var(--figma-color-bg); }
    h1 { margin: 0 0 8px; font-size: 15px; }
    p { margin: 0 0 14px; color: var(--figma-color-text-secondary); }
    .drop { display: grid; place-items: center; min-height: 120px; border: 1px dashed var(--figma-color-border-strong); border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; }
    .drop.drag { background: var(--figma-color-bg-hover); }
    input { display: none; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    button { border: 1px solid var(--figma-color-border); border-radius: 6px; padding: 7px 12px; background: var(--figma-color-bg-secondary); color: var(--figma-color-text); cursor: pointer; }
    button.primary { border-color: var(--figma-color-bg-brand); background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); }
    button:disabled { opacity: .45; cursor: default; }
    #status { min-height: 18px; margin-top: 10px; color: var(--figma-color-text-secondary); }
    #status.error { color: var(--figma-color-text-danger); }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <h1>Import Frontend Slides HTML</h1>
  <p>Select the <code>*.figma.html</code> generated by <code>pptx-to-figma-html.py</code>. The SVG slide artwork is imported as vectors and PowerPoint text/placeholders become editable text layers.</p>
  <label class="drop" id="drop">
    <input id="file" type="file" accept=".html,.json,text/html,application/json">
    <span id="fileLabel">Choose or drop a Figma-ready HTML file</span>
  </label>
  <div id="status"></div>
  <div class="actions">
    <button id="cancel">Close</button>
    <button id="import" class="primary" disabled>Import slides</button>
  </div>
<script>
  let parsedDeck = null;
  const fileInput = document.getElementById('file');
  const fileLabel = document.getElementById('fileLabel');
  const importButton = document.getElementById('import');
  const status = document.getElementById('status');
  const drop = document.getElementById('drop');

  function setStatus(message, isError = false) {
    status.textContent = message || '';
    status.classList.toggle('error', isError);
  }

  function parseDeckText(text, fileName) {
    if (/\.json$/i.test(fileName)) return JSON.parse(text);
    const doc = new DOMParser().parseFromString(text, 'text/html');
    const script = doc.getElementById('figma-deck-manifest');
    if (!script) throw new Error('This HTML has no #figma-deck-manifest block. Regenerate it with pptx-to-figma-html.py.');
    return JSON.parse(script.textContent);
  }

  async function loadFile(file) {
    if (!file) return;
    setStatus('Reading file…');
    try {
      const text = await file.text();
      parsedDeck = parseDeckText(text, file.name);
      if (!parsedDeck?.slides?.length) throw new Error('The manifest contains no slides.');
      fileLabel.textContent = `${file.name} · ${parsedDeck.slides.length} slide(s)`;
      importButton.disabled = false;
      setStatus('Ready to import. Existing slides will not be removed.');
    } catch (error) {
      parsedDeck = null;
      importButton.disabled = true;
      setStatus(error.message || String(error), true);
    }
  }

  fileInput.addEventListener('change', () => loadFile(fileInput.files[0]));
  ['dragenter', 'dragover'].forEach((type) => drop.addEventListener(type, (event) => {
    event.preventDefault(); drop.classList.add('drag');
  }));
  ['dragleave', 'drop'].forEach((type) => drop.addEventListener(type, (event) => {
    event.preventDefault(); drop.classList.remove('drag');
  }));
  drop.addEventListener('drop', (event) => loadFile(event.dataTransfer.files[0]));

  importButton.addEventListener('click', () => {
    if (!parsedDeck) return;
    importButton.disabled = true;
    setStatus('Sending deck to Figma…');
    parent.postMessage({ pluginMessage: { type: 'import-deck', deck: parsedDeck } }, '*');
  });
  document.getElementById('cancel').addEventListener('click', () => {
    parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
  });

  onmessage = (event) => {
    const message = event.data.pluginMessage;
    if (!message) return;
    if (message.type === 'status') setStatus(message.message);
    if (message.type === 'error') { setStatus(message.message, true); importButton.disabled = false; }
    if (message.type === 'done') { setStatus(message.message); importButton.disabled = false; }
  };
</script>
</body>
</html>
