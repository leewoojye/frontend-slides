name: Test PPTX → Figma fidelity converter

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/pptx-to-figma-html.py"
      - "figma-plugin/pptx-fidelity-importer/**"
      - "KU_DRI_LAB_PPT_Template_16_9.pptx"
      - ".github/workflows/test-pptx-figma-fidelity.yml"

jobs:
  convert-ku-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install converter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install python-pptx

      - name: Check source syntax
        run: |
          python -m py_compile scripts/pptx-to-figma-html.py
          node --check figma-plugin/pptx-fidelity-importer/code.js

      - name: Convert KU DRI Lab PowerPoint template
        run: |
          python scripts/pptx-to-figma-html.py \
            KU_DRI_LAB_PPT_Template_16_9.pptx \
            --output KU_DRI_LAB_PPT_Template_16_9.figma.html \
            --work-dir .figma-conversion-work

      - name: Validate standalone HTML manifest
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("KU_DRI_LAB_PPT_Template_16_9.figma.html")
          text = path.read_text(encoding="utf-8")
          match = re.search(
              r'<script id="figma-deck-manifest" type="application/json">(.*?)</script>',
              text,
              re.S,
          )
          assert match, "missing embedded Figma manifest"
          deck = json.loads(match.group(1))
          assert deck["width"] == 1920.0
          assert deck["height"] == 1080.0
          assert len(deck["slides"]) >= 10, f"unexpected slide count: {len(deck['slides'])}"
          assert all(slide.get("svg", "").lstrip().startswith("<svg") for slide in deck["slides"])
          assert sum(len(slide.get("textLayers", [])) for slide in deck["slides"]) > 0
          assert "KU_DRI_LAB_PPT_Template_16_9-assets/" not in text, "standalone output still uses external assets"
          print("slides:", len(deck["slides"]))
          print("editable text layers:", sum(len(slide.get("textLayers", [])) for slide in deck["slides"]))
          print("html bytes:", path.stat().st_size)
          PY

      - name: Upload converted template
        uses: actions/upload-artifact@v4
        with:
          name: ku-dri-lab-figma-html
          path: KU_DRI_LAB_PPT_Template_16_9.figma.html
          retention-days: 7
